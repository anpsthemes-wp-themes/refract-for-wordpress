name: Feature request
description: Something the plugin should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: Tell us what you want to get done, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you'd like the plugin to work.
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Other tools that do this well, screenshots, or examples.
